plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }
tasks.named('jar') { enabled = false } // Avoid a second non-executable plain JAR

// Run bootRun separately, then execute generateOpenApiSpec to write specs/openapi.json.
// This intentionally exports the real contract generated from controller and DTO annotations.
tasks.register('generateOpenApiSpec') {
    group = 'documentation'
    description = 'Fetch live OpenAPI specification from local running service into specs/openapi.json'
    doLast {
        def address = providers.gradleProperty('apiDocsUrl').orElse('http://localhost:8080/v3/api-docs').get()
        def conn = new URI(address).toURL().openConnection()
        conn.connectTimeout = 10000
        conn.readTimeout = 30000
        def spec = conn.inputStream.getText('UTF-8')
        def target = file('specs/openapi.json')
        target.parentFile.mkdirs()
        target.text = spec + '\n'
        println "Wrote ${target} (${spec.length()} chars)"
    }
}
